<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Linceo — il radar culturale di Roma</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Linceo: cosa succede a Roma. Mostre, teatro, opera, cinema, arte contemporanea, festival.">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f1ead9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Linceo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<!-- anteprima quando il link viene condiviso (WhatsApp, iMessage, Telegram…) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Linceo">
<meta property="og:title" content="Linceo">
<meta property="og:description" content="Il radar culturale di Roma: mostre, teatro, opera, cinema, arte contemporanea, festival.">
<meta property="og:url" content="https://alessialucentini.github.io/romeculturalcalendar/">
<meta property="og:image" content="https://alessialucentini.github.io/romeculturalcalendar/icons/og.jpg">
<meta property="og:image:width" content="600">
<meta property="og:image:height" content="600">
<meta name="twitter:card" content="summary">
<script>document.documentElement.className = "js";</script>
<link rel="preload" as="image" href="icons/linceo.webp" fetchpriority="high">
<link rel="stylesheet" href="style.css">
</head>
<body>
<section class="splash" id="splash" aria-label="Linceo">
  <button class="snd" id="snd" type="button" aria-label="Suono di benvenuto" aria-pressed="true"></button>
  <div class="splash-in" id="splash-in">
    <img class="splash-logo" src="icons/linceo.webp" width="800" height="800" alt="Linceo: un occhio al centro di due alberi con radici a forma di mano">
    <h1 class="splash-title">Linceo</h1>
    <p class="splash-sub">il radar culturale di Roma</p>
  </div>
  <button class="cue" id="cue" type="button">scorri per vedere<span class="chev" aria-hidden="true"></span></button>
</section>

<section class="gate" id="gate" hidden aria-labelledby="gate-t">
  <div class="gate-card">
    <img class="gate-logo" src="icons/linceo.webp" width="84" height="84" alt="">
    <h2 id="gate-t">Entra in Linceo</h2>
    <p class="gate-sub">Accedi per ritrovare i tuoi eventi salvati su ogni dispositivo e ricevere gli ultimi aggiornamenti via mail.</p>
    <div class="seg" data-mode="in" role="tablist"><span class="seg-pill"></span>
      <button type="button" role="tab" data-mode="in" aria-selected="true">Accedi</button>
      <button type="button" role="tab" data-mode="up" aria-selected="false">Registrati</button></div>
    <form id="gate-form" novalidate>
      <label class="fld"><span>Email</span><input id="g-mail" type="email" autocomplete="email" inputmode="email" autocapitalize="none" required></label>
      <label class="fld"><span>Password</span><input id="g-pass" type="password" autocomplete="current-password" minlength="8" required></label>
      <label class="chk"><input type="checkbox" id="g-rem" checked><i></i><span>Ricordami</span></label>
      <label class="chk" id="g-consent-row" hidden><input type="checkbox" id="g-consent"><i></i><span>Voglio ricevere via mail gli ultimi aggiornamenti di Linceo (puoi annullare quando vuoi)</span></label>
      <p class="gate-msg" id="g-msg" role="alert"></p>
      <button class="gate-go" id="g-go" type="submit">Accedi</button>
    </form>
    <div class="gate-links"><button type="button" id="g-forgot">Password dimenticata?</button><button type="button" id="g-skip">Continua senza accedere</button></div>
  </div>
</section>

<div class="app" id="app">
  <header class="top">
    <div class="wrap">
      <div class="brand">
        <img class="brand-logo" src="icons/linceo.webp" width="56" height="56" alt="Linceo">
        <div class="brand-text">
          <div class="kicker-row">
            <div class="kicker">Linceo · Roma</div>
            <div class="hbtns">
              <button class="ib sm" id="searchBtn" type="button" aria-label="Cerca eventi" data-icon="search"></button>
              <button class="ib sm" id="savedBtn" type="button" aria-label="Eventi salvati" aria-pressed="false" data-icon="heart"><span class="badge-n" id="savedCount" hidden>0</span></button>
            </div>
          </div>
          <h2 class="date" id="today-label">Linceo</h2>
          <form class="searchbox" id="searchbox" role="search" hidden>
            <input id="q" type="search" placeholder="Cerca eventi, luoghi…" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Cerca eventi">
            <button class="ib sm" id="searchClose" type="button" aria-label="Chiudi ricerca" data-icon="close"></button>
          </form>
        </div>
        <div class="stamp" id="stamp" hidden></div>
      </div>
      <div class="tabs" role="tablist" aria-label="Vista">
        <span class="tab-pill" aria-hidden="true"></span>
        <button role="tab" data-view="oggi" aria-selected="true">Oggi</button>
        <button role="tab" data-view="domani" aria-selected="false">Domani</button>
        <button role="tab" data-view="weekend" aria-selected="false">Weekend</button>
        <button role="tab" data-view="calendario" aria-selected="false">Calendario</button>
      </div>
      <div class="chips" id="chips" role="group" aria-label="Filtra per categoria"></div>
    </div>
  </header>

  <main class="wrap" id="main" aria-live="polite"></main>

  <section class="fb wrap" id="fb">
    <button class="fb-toggle" id="fb-toggle" type="button" aria-expanded="false" aria-controls="fb-panel"><span>Cosa possiamo migliorare? <b>Lascia un feedback</b></span><i class="chev" aria-hidden="true"></i></button>
    <div class="fb-panel" id="fb-panel"><div class="fb-in">
      <form id="fb-form"><textarea id="fb-text" maxlength="1000" rows="4" placeholder="Idee, errori, eventi che mancano…" aria-label="Il tuo feedback" required></textarea>
        <div class="fb-row"><small id="fb-count">0/1000</small><button class="gate-go sm" type="submit">Invia</button></div></form>
    </div></div>
    <p class="acct" id="acct"></p>
  </section>

  <footer id="foot"></footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><p class="wrap">Serve JavaScript per mostrare gli eventi.</p></noscript>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="app.js"></script>
</body>
</html>
