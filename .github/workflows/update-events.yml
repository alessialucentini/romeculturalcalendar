name: Aggiorna eventi e pubblica

on:
  schedule:
    - cron: "0 3 * * 0"          # ogni domenica 03:00 UTC (04:00/05:00 a Roma)
  workflow_dispatch:
    inputs:
      mode:
        description: "scrape = aggiorna gli eventi | probe = analizza come leggere ogni fonte | sample = scarica HTML di esempio"
        type: choice
        options: [scrape, probe, sample]
        default: scrape
      urls:
        description: "solo per mode=sample: URL singoli separati da spazio (vuoto = fonti predefinite)"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["web/**"]            # modifiche all'app: ripubblica senza rifare lo scraping

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test dei parser
        run: python tests/test_parsers.py
      - name: Probe delle fonti
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'probe'
        run: python scraper/probe.py
      - name: Campioni HTML
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'sample'
        run: python scraper/sample.py ${{ inputs.urls }}
      - name: Scraping
        if: github.event_name == 'schedule' || inputs.mode == 'scrape'
        run: python scraper/run.py
      - name: Salva i risultati
        run: |
          git config user.name "roma-oggi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A web/data web/ics data
          git diff --cached --quiet || git commit -m "Aggiornamento automatico $(date -u +%F)"
          git push

  deploy:
    needs: scrape
    if: ${{ !cancelled() && (needs.scrape.result == 'success' || needs.scrape.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}   # include il commit appena fatto dallo scraper
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
